<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="800" height="130" fill="none">
  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: -0.5px;
      fill: #0f172a;
      opacity: 1;
      transform: translateY(0);
      animation: titleFadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) both;
    }
    @keyframes titleFadeUp {
      0% {
        opacity: 0;
        transform: translateY(8px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .accent-line {
      stroke: #6366f1;
      stroke-width: 2.5;
      stroke-linecap: round;
      stroke-dasharray: 80;
      stroke-dashoffset: 0;
      animation: drawAccent 0.5s ease-out 0.65s both;
    }
    @keyframes drawAccent {
      0% {
        stroke-dashoffset: 80;
      }
      100% {
        stroke-dashoffset: 0;
      }
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 400;
      letter-spacing: 0.2px;
      fill: #475569;
    }
    .char {
      opacity: 1;
      animation: charFade 0.12s ease-out both;
    }
    @keyframes charFade {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
    .c0  { animation-delay: 1.05s; }
    .c1  { animation-delay: 1.09s; }
    .c2  { animation-delay: 1.13s; }
    .c3  { animation-delay: 1.17s; }
    .c4  { animation-delay: 1.21s; }
    .c5  { animation-delay: 1.25s; }
    .c6  { animation-delay: 1.29s; }
    .c7  { animation-delay: 1.33s; }
    .c8  { animation-delay: 1.37s; }
    .c9  { animation-delay: 1.41s; }
    .c10 { animation-delay: 1.45s; }
    .c11 { animation-delay: 1.49s; }
    .c12 { animation-delay: 1.53s; }
    .c13 { animation-delay: 1.57s; }
    .c14 { animation-delay: 1.61s; }
    .c15 { animation-delay: 1.65s; }
    .c16 { animation-delay: 1.69s; }
    .c17 { animation-delay: 1.73s; }
    .c18 { animation-delay: 1.77s; }

    @media (prefers-reduced-motion: reduce) {
      .title, .accent-line, .char {
        animation: none !important;
        opacity: 1 !important;
        transform: none !important;
        stroke-dashoffset: 0 !important;
      }
    }
  </style>

  <text x="400" y="52" text-anchor="middle" class="title">Kiran Sinha</text>
  <line x1="360" y1="68" x2="440" y2="68" class="accent-line" />
  <text x="400" y="102" text-anchor="middle" class="subtitle" xml:space="preserve"><tspan class="char c0">W</tspan><tspan class="char c1">e</tspan><tspan class="char c2">b</tspan><tspan class="char c3">&#160;</tspan><tspan class="char c4">&amp;</tspan><tspan class="char c5">&#160;</tspan><tspan class="char c6">a</tspan><tspan class="char c7">p</tspan><tspan class="char c8">p</tspan><tspan class="char c9">&#160;</tspan><tspan class="char c10">d</tspan><tspan class="char c11">e</tspan><tspan class="char c12">v</tspan><tspan class="char c13">e</tspan><tspan class="char c14">l</tspan><tspan class="char c15">o</tspan><tspan class="char c16">p</tspan><tspan class="char c17">e</tspan><tspan class="char c18">r</tspan></text>
</svg>
