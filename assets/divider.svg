<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 24" width="100%" height="24" fill="none">
  <defs>
    <!-- Base Divider Gradient -->
    <linearGradient id="div-base" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0" />
      <stop offset="15%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#58a6ff" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#30363d" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0" />
    </linearGradient>

    <!-- Animated Shimmer -->
    <linearGradient id="div-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#388bfd" stop-opacity="0" />
      <animate attributeName="x1" from="-100%" to="200%" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x2" from="0%" to="300%" dur="4s" repeatCount="indefinite" />
    </linearGradient>

    <radialGradient id="node-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform {
        display: none !important;
      }
    }
  </style>

  <!-- Base Line -->
  <line x1="20" y1="12" x2="820" y2="12" stroke="url(#div-base)" stroke-width="1.2" stroke-linecap="round" />

  <!-- Shimmer Beam Overlay -->
  <line x1="20" y1="12" x2="820" y2="12" stroke="url(#div-shimmer)" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />

  <!-- Center Glowing Node -->
  <circle cx="420" cy="12" r="7" fill="url(#node-glow)">
    <animate attributeName="r" values="5;9;5" dur="3s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="420" cy="12" r="3" fill="#58a6ff" />
  <circle cx="420" cy="12" r="1.2" fill="#ffffff" />
</svg>
