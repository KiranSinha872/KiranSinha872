<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 405 136" width="100%" height="136" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="card-bg-devd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>

    <!-- Corner Ambient Glow -->
    <radialGradient id="card-glow-devd" cx="90%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12">
        <animate attributeName="stop-opacity" values="0.08;0.18;0.08" dur="4.2s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0" />
    </radialGradient>
  </defs>

  <style>
    .card-border {
      stroke: #30363d;
      animation: pulseBorder 4.2s ease-in-out infinite;
    }
    @keyframes pulseBorder {
      0%, 100% { stroke: #30363d; }
      50% { stroke: #58a6ff; }
    }
    .repo-name {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 15px;
      font-weight: 600;
      fill: #58a6ff;
    }
    .repo-desc {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 12px;
      fill: #8b949e;
      line-height: 1.4;
    }
    .meta-text {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      font-size: 11px;
      fill: #7d8590;
    }
    .badge-text {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 10px;
      font-weight: 500;
      fill: #7d8590;
    }
    @media (prefers-reduced-motion: reduce) {
      .card-border { animation: none !important; stroke: #388bfd; }
    }
  </style>

  <!-- Card Frame -->
  <rect x="1" y="1" width="403" height="134" rx="10" fill="url(#card-bg-devd)" class="card-border" stroke-width="1.2" />
  <rect x="2" y="2" width="401" height="132" rx="9" fill="url(#card-glow-devd)" />

  <!-- Top: Folder Icon + Title -->
  <g transform="translate(18, 18)">
    <svg x="0" y="2" width="16" height="16" viewBox="0 0 16 16" fill="#7d8590">
      <path d="M2 2.5A2.5 2.5 0 0 1 4.5 0h8.75a.75.75 0 0 1 .75.75v12.5a.75.75 0 0 1-.75.75h-2.5a.75.75 0 0 1 0-1.5h1.75v-2h-8a1 1 0 0 0-.714 1.7.75.75 0 1 1-1.072 1.05A2.495 2.495 0 0 1 2 11.5Zm10.5-1h-8a1 1 0 0 0-1 1v6.708A2.486 2.486 0 0 1 4.5 9h8ZM5 12.25a.25.25 0 0 1 .25-.25h3.5a.25.25 0 0 1 .25.25v3.25a.25.25 0 0 1-.4.2l-1.6-1.2-1.6 1.2a.25.25 0 0 1-.4-.2Z"/>
    </svg>
    <text x="24" y="15" class="repo-name">devd</text>

    <!-- Public Pill Badge -->
    <rect x="315" y="1" width="52" height="18" rx="9" fill="#21262d" stroke="#30363d" stroke-width="0.8" />
    <text x="341" y="13" text-anchor="middle" class="badge-text">Public</text>
  </g>

  <!-- Description -->
  <g transform="translate(18, 56)">
    <text x="0" y="0" class="repo-desc">IIT Delhi DevClub portal recreation</text>
    <text x="0" y="17" class="repo-desc">Semantic HTML5 structure &amp; custom modern CSS layouts</text>
  </g>

  <!-- Bottom Metadata -->
  <g transform="translate(18, 108)">
    <circle cx="5" cy="5" r="4.5" fill="#563d7c" />
    <text x="16" y="9" class="meta-text">CSS / HTML</text>

    <rect x="92" y="-3" width="70" height="18" rx="9" fill="#21262d" />
    <text x="127" y="9" text-anchor="middle" class="badge-text">web-dev</text>

    <rect x="168" y="-3" width="75" height="18" rx="9" fill="#21262d" />
    <text x="205" y="9" text-anchor="middle" class="badge-text">devclub</text>
  </g>
</svg>
