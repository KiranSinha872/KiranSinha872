name: Update Competitive Stats

on:
  schedule:
    - cron: '0 0 * * *'  # Runs daily at midnight UTC
  workflow_dispatch:      # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run stats update script
        run: |
          python scripts/update_stats.py

      - name: Commit and push if stats changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/competitive.svg scripts/stats_cache.json
          if git diff --staged --quiet; then
            echo "No changes in competitive stats. Skipping commit."
          else
            git commit -m "chore(stats): update competitive programming stats [skip ci]"
            git push
          fi
